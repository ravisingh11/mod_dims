<IfModule !mod_dims.c>
    LoadModule dims_module modules/libmod_dims.so
</IfModule>

DimsDownloadTimeout ${DIMS_DOWNLOAD_TIMEOUT}
DimsConnectTimeout ${DIMS_CONNECT_TIMEOUT}
DimsImagemagickTimeout ${DIMS_IMAGEMAGICK_TIMEOUT}
DimsMaxDownloadBytes ${DIMS_MAX_DOWNLOAD_BYTES}
DimsMaxRedirects ${DIMS_MAX_REDIRECTS}
DimsAllowedFetchSchemes ${DIMS_ALLOWED_FETCH_SCHEMES}
DimsLogSensitiveData ${DIMS_LOG_SENSITIVE_DATA}
DimsAllowLegacyEcb ${DIMS_ALLOW_LEGACY_ECB}

# DimsClient <appId> [<noImageUrl> <cache control max-age> <edge control downstream-ttl> <trustSource?> <minSourceCache> <maxSourceCache> <password>]
DimsAddClient ${DIMS_CLIENT} ${DIMS_NO_IMAGE_URL} ${DIMS_CACHE_CONTROL_MAX_AGE} ${DIMS_EDGE_CONTROL_DOWNSTREAM_TTL} ${DIMS_TRUST_SOURCE} ${DIMS_MIN_SOURCE_CACHE} ${DIMS_MAX_SOURCE_CACHE} ${DIMS_SECRET}

DimsDefaultImageURL ${DIMS_DEFAULT_IMAGE_URL}
DimsCacheExpire ${DIMS_CACHE_EXPIRE}
DimsNoImageCacheExpire ${DIMS_NO_IMAGE_CACHE_EXPIRE}
DimsUserAgentEnabled true
DimsEncryptionAlgorithm ${DIMS_ENCRYPTION_ALGORITHM}
DimsSignatureAlgorithm ${DIMS_SIGNATURE_ALGORITHM}
DimsStrictValidation ${DIMS_STRICT_VALIDATION}
DimsStatusExtended ${DIMS_STATUS_EXTENDED}
DimsEnableOpCache ${DIMS_ENABLE_OP_CACHE}
DimsOpCacheSize ${DIMS_OP_CACHE_SIZE}
DimsFetchConnectionReuse ${DIMS_FETCH_CONNECTION_REUSE}
DimsMaxConcurrentFetchesPerChild ${DIMS_MAX_CONCURRENT_FETCHES_PER_CHILD}

## Handler definitions. ##

DimsAddWhitelist ${DIMS_WHITELIST}
<Location /dims3/>
    SetHandler dims3
</Location>

<Location /dims4/>
    SetHandler dims4
</Location>

<Location /dims-status/>
    SetHandler dims-status
</Location>
